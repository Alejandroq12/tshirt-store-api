      x-contract-status: ready-to-implement
      x-authorization: manager
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of client orders
          content:
            application/json:
              schema:
