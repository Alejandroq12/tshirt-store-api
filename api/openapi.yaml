  /orders/{orderId}/status:
    patch:
      tags: [Orders]
      summary: Change an order status
      description: |
        Managers advance `paid` to `processing` and `processing` to `shipped`.
        Clients may cancel their own order before `shipped`. `paid` is webhook-only.
        Cancelling a paid order restores stock; refund data is not returned.
      operationId: updateOrderStatus
      x-requirement: Manager status flow; client cancellation before shipped
      x-contract-status: ready-to-implement
      x-authorization: manager for processing/shipped; client owner for cancelled
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
            example:
              status: processing
      responses:
        '200':
          description: Order state immediately after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: ffffffff-ffff-4fff-8fff-fffffffffff3
                clientId: 11111111-1111-4111-8111-111111111111
                status: processing
                paymentMethod: payment_intent
                items:
                  - id: ffffffff-ffff-4fff-8fff-fffffffffff4
                    productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                    skuId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2
                    productName: Classic Crew T-Shirt
                    skuCode: CREW-RED-M
                    size: M
                    color: Red
                    unitPrice: '19.99'
                    quantity: 1
                    lineTotal: '19.99'
                totalAmount: '19.99'
                currency: USD
                createdAt: '2026-08-24T11:00:00Z'
                updatedAt: '2026-08-26T14:45:00Z'
                paidAt: '2026-08-24T11:05:00Z'
                cancelledAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: Requested transition is not allowed from the current state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationError'

  /payment-intents:
    post:
      tags: [Payments]
      summary: Create a Payment Intent for a pending cart order
      description: |
        Requires the caller's pending order, active products, and sufficient
        stock for every item. The amount comes from the stored order. Only one
        Payment Intent may exist per order.
      operationId: createPaymentIntent
      x-requirement: Payment Intents for cart checkout with stock validation
      x-contract-status: ready-to-implement
      x-authorization: client owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentCreate'
            example:
              orderId: ffffffff-ffff-4fff-8fff-fffffffffff1
      responses:
        '201':
          description: Payment Intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
              example:
                id: pi_3ExampleIntent
                orderId: ffffffff-ffff-4fff-8fff-fffffffffff1
                clientSecret: pi_3ExampleIntent_secret_example
                amount: '39.98'
                currency: USD
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: >
            Order is not pending, a product is inactive, stock is insufficient,
            or a Payment Intent already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PaymentIntentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/PaymentProviderError'

  /payment-links:
    post:
      tags: [Payments]
      summary: Generate a shareable Payment Link for one SKU
      description: |
        Creates a reusable hosted link for one SKU whose product is active and
        for a fixed quantity. No order exists until a paid webhook is processed.
      operationId: createPaymentLink
      x-requirement: Payment Links for single-product purchases
      x-contract-status: ready-to-implement
      x-authorization: manager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLinkCreate'
            example:
              skuId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
              quantity: 1
      responses:
        '201':
          description: Payment Link created; no order exists yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
              example:
                id: 99999999-9999-4999-8999-999999999991
                skuId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
                quantity: 1
                url: https://buy.stripe.com/example
                createdAt: '2026-08-26T14:50:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SkuNotFound'
        '409':
          description: Parent product is not active
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/PaymentProviderError'

  /webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Receive Stripe payment events
      description: |
        Verifies the raw body and `Stripe-Signature`, then processes supported
        payment events idempotently. A 204 confirms durable receipt; unfinished
        processing is retried internally.
      operationId: receiveStripeWebhook
      x-requirement: Webhook handling for both Stripe payment methods
      x-contract-status: ready-to-implement
      x-authorization: valid Stripe signature
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent'
            example:
              id: evt_1ExampleCompleted
              type: checkout.session.completed
              data:
                object:
                  id: cs_test_example
                  payment_link: plink_example
                  payment_status: paid
                  customer_details:
                    email: ana@example.com
      responses:
        '204':
          description: >
            Event durably accepted for processing/reconciliation, or already
            processed; no response body
        '400':
          description: Payload or signature verification failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by sign-up, login, or refresh-token.

  parameters:
    Limit:
      name: limit
      in: query
      required: true
      description: Number of records requested.
      example: 20
      schema:
        type: integer
        minimum: 1
    Offset:
      name: offset
      in: query
      required: true
      description: Number of matching records skipped.
      example: 0
      schema:
        type: integer
        minimum: 0
    Category:
      name: category
      in: query
      required: false
      description: Exact category slug.
      example: t-shirts
      schema:
        type: string
        minLength: 1
    ProductId:
      name: productId
      in: path
      required: true
      example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
      schema:
        type: string
        format: uuid
    SkuId:
      name: skuId
      in: path
      required: true
      example: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
      schema:
        type: string
        format: uuid
    CartItemId:
      name: itemId
      in: path
      required: true
      example: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee2
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      example: ffffffff-ffff-4fff-8fff-fffffffffff3
      schema:
        type: string
        format: uuid
    OrderFrom:
      name: from
      in: query
      required: false
      description: Inclusive createdAt lower bound.
      example: '2026-08-01T00:00:00Z'
      schema:
        type: string
        format: date-time
    OrderTo:
      name: to
      in: query
      required: false
      description: Inclusive createdAt upper bound.
      example: '2026-08-26T23:59:59Z'
      schema:
        type: string
        format: date-time
    OrderStatusFilter:
      name: status
      in: query
      required: false
      example: paid
      schema:
        $ref: '#/components/schemas/OrderStatus'
    MinPrice:
      name: minPrice
      in: query
      required: false
      description: Inclusive totalAmount lower bound.
      example: '10.00'
      schema:
        $ref: '#/components/schemas/Amount'
    MaxPrice:
      name: maxPrice
      in: query
      required: false
      description: Inclusive totalAmount upper bound.
      example: '50.00'
      schema:
        $ref: '#/components/schemas/Amount'

  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnauthorizedProblem'
    Forbidden:
      description: The authenticated role is not permitted to perform the operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ForbiddenProblem'
    ProductNotFound:
      description: Product does not exist or is not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NotFoundProblem'
    ProductOrCategoryNotFound:
      description: Product or referenced category does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NotFoundProblem'
    SkuNotFound:
      description: SKU does not exist or its product is not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NotFoundProblem'
    CartItemNotFound:
      description: Cart item does not exist in the current client's cart
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NotFoundProblem'
    OrderNotFound:
      description: Order does not exist or is not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NotFoundProblem'
    ValidationError:
      description: Request schema validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    TooManyRequests:
      description: Password-reset rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the caller may retry.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RateLimitProblem'
    PaymentProviderError:
      description: Stripe did not complete the requested provider operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'

  schemas:
    ProblemFields:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: about:blank
          description: >-
            Stable URI identifying the error kind. `about:blank` represents
            the HTTP status itself; documented application URNs distinguish
            errors that clients must handle differently despite sharing a
            status code.
        title:
          type: string
          description: Short, client-safe summary.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Optional client-safe explanation; never contains internal diagnostics.
        instance:
          type: string
          format: uri-reference

    Problem:
      description: Public error body. Undeclared internal fields are never returned.
      allOf:
        - $ref: '#/components/schemas/ProblemFields'
      unevaluatedProperties: false

    BadRequestProblem:
      example:
        type: about:blank
        title: Bad Request
        status: 400
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              const: 400

    UnauthorizedProblem:
      example:
        type: about:blank
        title: Unauthorized
        status: 401
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              const: 401

    ForbiddenProblem:
      example:
        type: about:blank
        title: Forbidden
        status: 403
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              const: 403

    NotFoundProblem:
      example:
        type: about:blank
        title: Not Found
        status: 404
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              const: 404

    ConflictProblem:
      example:
        type: about:blank
        title: Conflict
        status: 409
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              const: 409

    PayloadTooLargeProblem:
      example:
        type: about:blank
        title: Content Too Large
        status: 413
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              const: 413

    UnsupportedMediaTypeProblem:
      example:
        type: about:blank
        title: Unsupported Media Type
        status: 415
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              const: 415

    RateLimitProblem:
      example:
        type: about:blank
        title: Too Many Requests
        status: 429
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              const: 429

    PaymentProviderProblem:
      example:
        type: about:blank
        title: Bad Gateway
        status: 502
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              const: 502

    ValidationProblem:
      example:
        type: about:blank
        title: Unprocessable Content
        status: 422
        errors:
          - field: email
            message: Must be a valid email address.
      allOf:
        - $ref: '#/components/schemas/ProblemFields'
        - type: object
          required: [errors]
          properties:
            status:
              const: 422
            errors:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
      unevaluatedProperties: false

    EmptyCartProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemFields'
        - type: object
          properties:
            type:
              const: urn:tshirt-store:problem:empty-cart
            title:
              const: Cart is empty
            status:
              const: 409
      unevaluatedProperties: false

    PendingOrderExistsProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemFields'
        - type: object
          properties:
            type:
              const: urn:tshirt-store:problem:pending-order-exists
            title:
              const: Pending order already exists
            status:
              const: 409
      unevaluatedProperties: false

    PaymentIntentConflict:
      example:
        type: about:blank
        title: Conflict
        status: 409
      allOf:
        - $ref: '#/components/schemas/ProblemFields'
        - type: object
          properties:
            status:
              const: 409
            items:
              type: array
              minItems: 1
              description: Present only when current stock prevents payment.
              items:
                type: object
                additionalProperties: false
                required: [skuId, requestedQuantity, availableQuantity]
                properties:
                  skuId:
                    type: string
                    format: uuid
                  requestedQuantity:
                    type: integer
                    minimum: 1
                  availableQuantity:
                    type: integer
                    minimum: 0
      unevaluatedProperties: false

    Amount:
      type: string
      pattern: '^(0|[1-9]\d{0,7})\.\d{2}$'
      description: Canonical non-negative decimal(10,2) amount.

    PositiveAmount:
      type: string
      pattern: '^(?!0\.00$)(0|[1-9]\d{0,7})\.\d{2}$'
      description: Canonical positive decimal(10,2) amount.

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Store currency as an ISO 4217 code.

    Pagination:
      type: object
      additionalProperties: false
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    UserRole:
      type: string
      enum: [manager, client]

    User:
      type: object
      additionalProperties: false
      required: [id, email, firstName, lastName, role]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    ClientUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [role]
          properties:
            role:
              type: string
              const: client

    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true

    AuthSession:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, accessTokenExpiresAt, user]
      properties:
        accessToken:
          type: string
          readOnly: true
          description: Bearer credential returned only to the authenticated caller; do not log it.
        refreshToken:
          type: string
          readOnly: true
          description: Session credential returned only at sign-up or login; do not log it.
        accessTokenExpiresAt:
          type: string
          format: date-time
          readOnly: true
        user:
          $ref: '#/components/schemas/User'

    ClientAuthSession:
      allOf:
        - $ref: '#/components/schemas/AuthSession'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/ClientUser'

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true

    AccessToken:
      type: object
      additionalProperties: false
      required: [accessToken, accessTokenExpiresAt]
      properties:
        accessToken:
          type: string
          readOnly: true
          description: Bearer credential returned only to the authenticated caller; do not log it.
        accessTokenExpiresAt:
          type: string
          format: date-time
          readOnly: true

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [resetToken, newPassword]
      properties:
        resetToken:
          type: string
          minLength: 1
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true

    LifecycleState:
      type: string
      enum: [active, inactive, retired]
      description: Active is available; inactive is reversible; retired is permanent and retained.

    Category:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string

    ProductFields:
      type: object
      required:
        - id
        - categoryId
        - name
        - description
        - status
        - retiredAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Generated by the server at creation and always returned.
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
          description: Always returned; null when no description was supplied.
        status:
          $ref: '#/components/schemas/LifecycleState'
        retiredAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: Always returned; generated on retirement and otherwise null.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Product:
      description: Strict core representation returned immediately after create or update.
      allOf:
        - $ref: '#/components/schemas/ProductFields'
      unevaluatedProperties: false

    ProductCreate:
      type: object
      additionalProperties: false
      required: [categoryId, name]
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']

    ProductUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/LifecycleState'

    ProductSummary:
      type: object
      additionalProperties: false
      required: [id, category, name, description, status, primaryImageUrl, liked]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/Category'
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/LifecycleState'
        primaryImageUrl:
          type: [string, 'null']
          format: uri
          description: Product fallback primary URL, or null when none exists.
        liked:
          type: [boolean, 'null']
          description: Client-specific state; null for anonymous users and managers.

    ProductPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ImageAsset:
      type: object
      additionalProperties: false
      required:
        - id
        - productId
        - url
        - skuIds
        - isProductPrimary
        - primaryForSkuIds
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        productId:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
          description: Generated after upload succeeds; clients cannot supply or change it.
        skuIds:
          type: array
          readOnly: true
          items:
            type: string
            format: uuid
          description: Empty for a product fallback image.
        isProductPrimary:
          type: boolean
          readOnly: true
        primaryForSkuIds:
          type: array
          readOnly: true
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
          readOnly: true

    ImageUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
        skuIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Omit or send an empty list for a product fallback image.
        primary:
          type: boolean
          default: false
          description: |
            Applies to the product fallback or every listed SKU. The first image
            becomes primary automatically; true replaces an existing primary.

    SkuFields:
      type: object
      required:
        - id
        - productId
        - skuCode
        - size
        - color
        - price
        - currency
        - stockQuantity
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        productId:
          type: string
          format: uuid
          readOnly: true
        skuCode:
          type: string
        size:
          type: string
        color:
          type: string
        price:
          $ref: '#/components/schemas/PositiveAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        stockQuantity:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Sku:
      description: Strict core SKU representation returned immediately after create or update.
      allOf:
        - $ref: '#/components/schemas/SkuFields'
      unevaluatedProperties: false

    SkuCreate:
      type: object
      additionalProperties: false
      required: [productId, skuCode, size, color, price, stockQuantity]
      properties:
        productId:
          type: string
          format: uuid
        skuCode:
          type: string
          minLength: 1
          maxLength: 64
        size:
          type: string
          minLength: 1
          maxLength: 20
        color:
          type: string
          minLength: 1
          maxLength: 40
        price:
          $ref: '#/components/schemas/PositiveAmount'
        stockQuantity:
          type: integer
          minimum: 0

    SkuUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        skuCode:
          type: string
          minLength: 1
          maxLength: 64
        size:
          type: string
          minLength: 1
          maxLength: 20
        color:
          type: string
          minLength: 1
          maxLength: 40
        price:
          $ref: '#/components/schemas/PositiveAmount'
        stockQuantity:
          type: integer
          minimum: 0

    ImageSource:
      type: string
      enum: [sku, product, none]

    CatalogSku:
      type: object
      additionalProperties: false
      required:
        - id
        - productId
        - skuCode
        - size
        - color
        - price
        - currency
        - stockQuantity
        - imageIds
        - primaryImageId
        - imageSource
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        skuCode:
          type: string
        size:
          type: string
        color:
          type: string
        price:
          $ref: '#/components/schemas/PositiveAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        stockQuantity:
          type: integer
          minimum: 0
        imageIds:
          type: array
          items:
            type: string
            format: uuid
        primaryImageId:
          type: [string, 'null']
          format: uuid
        imageSource:
          $ref: '#/components/schemas/ImageSource'

    SkuDetail:
      allOf:
        - $ref: '#/components/schemas/SkuFields'
        - type: object
          required: [images, primaryImageId, imageSource]
          properties:
            images:
              type: array
              items:
                $ref: '#/components/schemas/ImageAsset'
            primaryImageId:
              type: [string, 'null']
              format: uuid
            imageSource:
              $ref: '#/components/schemas/ImageSource'
      unevaluatedProperties: false

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - type: object
          required:
            - category
            - imageAssets
            - fallbackImageIds
            - primaryImageId
            - skus
            - liked
          properties:
            category:
              $ref: '#/components/schemas/Category'
            imageAssets:
              type: array
              items:
                $ref: '#/components/schemas/ImageAsset'
            fallbackImageIds:
              type: array
              items:
                type: string
                format: uuid
            primaryImageId:
              type: [string, 'null']
              format: uuid
            skus:
              type: array
              items:
                $ref: '#/components/schemas/CatalogSku'
            liked:
              type: [boolean, 'null']
              description: Client-specific state; null for anonymous users and managers.
      unevaluatedProperties: false

    LikeUpdate:
      type: object
      additionalProperties: false
      required: [liked]
      properties:
        liked:
          type: boolean

    LikeState:
      type: object
      additionalProperties: false
      required: [productId, liked]
      properties:
        productId:
          type: string
          format: uuid
        liked:
          type: boolean

    CartItem:
      type: object
      additionalProperties: false
      required:
        - id
        - skuId
        - productId
        - productName
        - skuCode
        - size
        - color
        - quantity
        - unitPrice
        - lineTotal
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        skuId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
          readOnly: true
        productName:
          type: string
          readOnly: true
        skuCode:
          type: string
          readOnly: true
        size:
          type: string
          readOnly: true
        color:
          type: string
          readOnly: true
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/PositiveAmount'
          readOnly: true
          description: Current SKU price at response time.
        lineTotal:
          allOf:
            - $ref: '#/components/schemas/PositiveAmount'
          readOnly: true

    Cart:
      type: object
      additionalProperties: false
      required: [id, items, subtotalAmount, currency, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotalAmount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          readOnly: true
        currency:
          $ref: '#/components/schemas/Currency'
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CartItemCreate:
      type: object
      additionalProperties: false
      required: [skuId, quantity]
      properties:
        skuId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    CartItemUpdate:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1

    OrderStatus:
      type: string
      enum: [pending, paid, processing, shipped, cancelled]

    PaymentMethod:
      type: string
      enum: [payment_link, payment_intent]

    OrderItem:
      type: object
      additionalProperties: false
      required:
        - id
        - productId
        - skuId
        - productName
        - skuCode
        - size
        - color
        - unitPrice
        - quantity
        - lineTotal
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        productId:
          type: string
          format: uuid
          readOnly: true
        skuId:
          type: string
          format: uuid
          readOnly: true
        productName:
          type: string
          readOnly: true
        skuCode:
          type: string
          readOnly: true
        size:
          type: string
          readOnly: true
        color:
          type: string
          readOnly: true
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/PositiveAmount'
          readOnly: true
        quantity:
          type: integer
          minimum: 1
          readOnly: true
        lineTotal:
          allOf:
            - $ref: '#/components/schemas/PositiveAmount'
          readOnly: true

    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - clientId
        - status
        - paymentMethod
        - items
        - totalAmount
        - currency
        - createdAt
        - updatedAt
        - paidAt
        - cancelledAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clientId:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        items:
          type: array
          minItems: 1
          readOnly: true
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveAmount'
          readOnly: true
        currency:
          $ref: '#/components/schemas/Currency'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        paidAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: Always returned; set by the successful-payment webhook.
        cancelledAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: Always returned; set when status becomes cancelled.

    OrderPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'

    OrderStatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [processing, shipped, cancelled]

    PaymentIntentCreate:
      type: object
      additionalProperties: false
      required: [orderId]
      properties:
        orderId:
          type: string
          format: uuid

    PaymentIntent:
      type: object
      additionalProperties: false
      required: [id, orderId, clientSecret, amount, currency]
      properties:
        id:
          type: string
          readOnly: true
          description: Stripe Payment Intent ID.
        orderId:
          type: string
          format: uuid
          readOnly: true
        clientSecret:
          type: string
          readOnly: true
          description: >
            Sensitive confirmation credential returned only to the order owner;
            do not log it.
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveAmount'
          readOnly: true
        currency:
          $ref: '#/components/schemas/Currency'

    PaymentLinkCreate:
      type: object
      additionalProperties: false
      required: [skuId, quantity]
      properties:
        skuId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    PaymentLink:
      type: object
      additionalProperties: false
      required: [id, skuId, quantity, url, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        skuId:
          type: string
          format: uuid
          readOnly: true
        quantity:
          type: integer
          minimum: 1
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true

    StripeEvent:
      type: object
      required: [id, type, data]
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
          enum: [checkout.session.completed, payment_intent.succeeded]
        data:
          type: object
          additionalProperties: true
