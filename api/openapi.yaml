        create payment, change stock, or change the cart. Only one pending order
        is allowed per client.
      operationId: createOrderFromCart
      x-requirement: Client buys products and creates own orders
      x-contract-status: ready-to-implement
      x-authorization: client
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Pending order created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
                example: /v1/orders/ffffffff-ffff-4fff-8fff-fffffffffff1
              description: URL of the created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: ffffffff-ffff-4fff-8fff-fffffffffff1
                clientId: 11111111-1111-4111-8111-111111111111
                status: pending
                paymentMethod: payment_intent
                items:
                  - id: ffffffff-ffff-4fff-8fff-fffffffffff2
                    productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                    skuId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
                    productName: Classic Crew T-Shirt
                    skuCode: CREW-RED-S
                    size: S
                    color: Red
