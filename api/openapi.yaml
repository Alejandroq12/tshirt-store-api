                    updatedAt: '2026-08-24T08:00:00Z'
                    paidAt: '2026-08-23T13:01:00Z'
                    cancelledAt: null
                  - id: ffffffff-ffff-4fff-8fff-fffffffffff9
                    clientId: 11111111-1111-4111-8111-111111111111
                    status: paid
                    paymentMethod: payment_link
                    items:
                      - id: ffffffff-ffff-4fff-8fff-fffffffffffa
                        productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                        skuId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb3
                        productName: Classic Crew T-Shirt
                        skuCode: CREW-BLUE-M
                        size: M
                        color: Blue
                        unitPrice: '21.99'
                        quantity: 1
