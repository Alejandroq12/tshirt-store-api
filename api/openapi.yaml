openapi: 3.1.0

info:
  title: T-Shirt Store API
  version: 1.0.0
  description: >-
    REST API for a T-shirt store covering authentication, catalog, carts,
    orders, payments, and role-based operations for clients and managers.

servers:
  - url: /v1
    description: Deployment-independent API base path

tags:
  - name: Authentication
    description: >-
      Sign-up, sign-in, sign-out, access-token refresh, and the forgotten-password
      and authenticated-change password flows.
  - name: Products
    description: >-
      Catalogue reads for anonymous visitors and clients, plus manager creation
      and lifecycle updates.
  - name: SKUs
    description: >-
      Purchasable variants of a product, distinguished by size and color, each
      carrying its own price and stock.
  - name: Images
    description: >-
      Product-owned image assets, optionally shared by the SKUs that look the same.
  - name: Likes
    description: >-
      The current client's liked state for a product, set and cleared through one
      idempotent operation.
  - name: Cart
    description: >-
      The signed-in client's own cart and the items in it. Nothing here reserves
      stock.
  - name: Checkout
    description: >-
      Snapshotting the current cart into a pending order.
  - name: Orders
    description: >-
      Reading order history and moving an order through its status flow.
  - name: Payments
    description: >-
      Stripe Payment Intents for cart checkout and Payment Links for single-SKU
      purchases.
  - name: Webhooks
    description: >-
      Inbound Stripe events that mark orders paid and adjust stock.

paths:
  /auth/sign-up:
    post:
      tags: [Authentication]
      summary: Register a client
      operationId: signUp
      x-requirement: Authentication - sign up
      x-contract-status: ready-to-implement
      x-authorization: anonymous
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              email: ana@example.com
              password: example-password
              firstName: Ana
              lastName: Rivera
      responses:
        '201':
          description: Client registered and authentication tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAuthSession'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.access
                refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
                accessTokenExpiresAt: '2026-08-26T15:00:00Z'
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: ana@example.com
                  firstName: Ana
                  lastName: Rivera
                  role: client
        '409':
          description: Email is already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      operationId: login
      x-requirement: Authentication - sign in
      x-contract-status: ready-to-implement
      x-authorization: anonymous
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ana@example.com
              password: example-password
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.new-access
                refreshToken: eyJhbGciOiJIUzI1NiJ9.new-refresh
                accessTokenExpiresAt: '2026-08-26T16:00:00Z'
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: ana@example.com
                  firstName: Ana
                  lastName: Rivera
                  role: client
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: End the current authentication session
      operationId: logout
      x-requirement: Authentication - sign out
      x-contract-status: ready-to-implement
      x-authorization: authenticated manager or client
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current session ended; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Refresh the access token
      description: |
        The refresh token remains valid until it expires or its session is
        revoked. This operation returns a new access token only.
      operationId: refreshAccessToken
      x-requirement: Mentor feedback - access-token refresh
      x-contract-status: ready-to-implement
      x-authorization: anonymous with a valid refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.refreshed-access
                accessTokenExpiresAt: '2026-08-26T17:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset email
      description: Returns 202 whether or not the email belongs to a user.
      operationId: forgotPassword
      x-requirement: Authentication - forgot password; rate limit reset flow
      x-contract-status: ready-to-implement
      x-authorization: anonymous
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: ana@example.com
      responses:
        '202':
          description: Request accepted; no response body
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset a forgotten password with a reset token
      description: |
        A successful reset queues the required password-change email
        notification and revokes every session belonging to that user.
      operationId: resetPassword
      x-requirement: Authentication - reset password; rate limit reset flow
      x-contract-status: ready-to-implement
      x-authorization: anonymous with a valid reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              resetToken: reset-token-from-email
              newPassword: replacement-password
      responses:
        '204':
          description: Password reset and notification queued; no response body
        '400':
          description: Reset token is invalid, expired, or already used
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the authenticated user's password
      description: |
        A successful change queues the required email notification and revokes
        every session belonging to that user, including the caller's own, so
        the client must sign in again.
      operationId: changePassword
      x-requirement: Email notification when a user changes their password
      x-contract-status: ready-to-implement
      x-authorization: authenticated manager or client
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: example-password
              newPassword: replacement-password
      responses:
        '204':
          description: Password changed and notification queued; no response body
        '400':
          description: Current password is incorrect
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /products:
    get:
      tags: [Products]
      summary: List products with category filtering and pagination
      description: |
        Anonymous users and clients receive active products; managers receive
        every lifecycle state. `category` matches one exact seeded slug; an
        unknown slug returns an empty page. Results use `createdAt DESC, id DESC`.
      operationId: listProducts
      x-requirement: Paginated product list; search by category; Manager reads all products
      x-contract-status: ready-to-implement
      x-authorization: anonymous or authenticated manager/client
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Category'
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                items:
                  - id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                    category:
                      id: cccccccc-cccc-4ccc-8ccc-ccccccccccc1
                      name: T-Shirts
                      slug: t-shirts
                    name: Classic Crew T-Shirt
                    description: Cotton crew-neck shirt.
                    status: active
                    primaryImageUrl: https://cdn.example.com/products/classic-crew/front.jpg
                    liked: null
                pagination:
                  limit: 20
                  offset: 0
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

    post:
      tags: [Products]
      summary: Create a product
      description: |
        The server generates the ID and timestamps and creates the product with
        status inactive. Related SKUs and images do not exist in this response.
      operationId: createProduct
      x-requirement: Manager creates products
      x-contract-status: ready-to-implement
      x-authorization: manager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            example:
              categoryId: cccccccc-cccc-4ccc-8ccc-ccccccccccc1
              name: Essential Pocket T-Shirt
              description: Cotton shirt with a chest pocket.
      responses:
        '201':
          description: Product created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
                example: /v1/products/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2
              description: URL of the created product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2
                categoryId: cccccccc-cccc-4ccc-8ccc-ccccccccccc1
                name: Essential Pocket T-Shirt
                description: Cotton shirt with a chest pocket.
                status: inactive
                retiredAt: null
                createdAt: '2026-08-26T14:00:00Z'
                updatedAt: '2026-08-26T14:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Referenced category does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '422':
          $ref: '#/components/responses/ValidationError'

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Get product details
      description: |
        Anonymous users and clients can read active products; managers can read
        any state. Images are returned once and referenced by each SKU.
      operationId: getProduct
      x-requirement: Public product details including images; SKU catalog
      x-contract-status: ready-to-implement
      x-authorization: anonymous or authenticated manager/client
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
              example:
                id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                categoryId: cccccccc-cccc-4ccc-8ccc-ccccccccccc1
                name: Classic Crew T-Shirt
                description: Cotton crew-neck shirt.
                status: active
                retiredAt: null
                createdAt: '2026-08-20T10:00:00Z'
                updatedAt: '2026-08-25T09:00:00Z'
                category:
                  id: cccccccc-cccc-4ccc-8ccc-ccccccccccc1
                  name: T-Shirts
                  slug: t-shirts
                imageAssets:
                  - id: dddddddd-dddd-4ddd-8ddd-ddddddddddd1
                    productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                    url: https://cdn.example.com/products/classic-crew/front.jpg
                    skuIds: []
                    isProductPrimary: true
                    primaryForSkuIds: []
                    createdAt: '2026-08-20T10:05:00Z'
                  - id: dddddddd-dddd-4ddd-8ddd-ddddddddddd2
                    productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                    url: https://cdn.example.com/products/classic-crew/red.jpg
                    skuIds:
                      - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
                      - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2
                    isProductPrimary: false
                    primaryForSkuIds:
                      - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
                      - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2
                    createdAt: '2026-08-20T10:06:00Z'
                fallbackImageIds:
                  - dddddddd-dddd-4ddd-8ddd-ddddddddddd1
                primaryImageId: dddddddd-dddd-4ddd-8ddd-ddddddddddd1
                skus:
                  - id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
                    productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                    skuCode: CREW-RED-S
                    size: S
                    color: Red
                    price: '19.99'
                    currency: USD
                    stockQuantity: 8
                    imageIds:
                      - dddddddd-dddd-4ddd-8ddd-ddddddddddd2
                    primaryImageId: dddddddd-dddd-4ddd-8ddd-ddddddddddd2
                    imageSource: sku
                  - id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2
                    productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                    skuCode: CREW-RED-M
                    size: M
                    color: Red
                    price: '19.99'
                    currency: USD
                    stockQuantity: 6
                    imageIds:
                      - dddddddd-dddd-4ddd-8ddd-ddddddddddd2
                    primaryImageId: dddddddd-dddd-4ddd-8ddd-ddddddddddd2
                    imageSource: sku
                liked: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    patch:
      tags: [Products]
      summary: Update product fields or lifecycle state
      description: |
        `inactive` is reversible; `retired` is terminal and retained. Products
        are never physically deleted. Activation requires a usable fallback
        primary image.
      operationId: updateProduct
      x-requirement: Manager updates, disables, reactivates, or retires products
      x-contract-status: ready-to-implement
      x-authorization: manager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
            example:
              description: Cotton crew-neck shirt with reinforced seams.
      responses:
        '200':
          description: Product state immediately after the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                categoryId: cccccccc-cccc-4ccc-8ccc-ccccccccccc1
                name: Classic Crew T-Shirt
                description: Cotton crew-neck shirt with reinforced seams.
                status: active
                retiredAt: null
                createdAt: '2026-08-20T10:00:00Z'
                updatedAt: '2026-08-26T14:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductOrCategoryNotFound'
        '409':
          description: >
            Requested activation targets a retired product or lacks a usable
            primary image
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationError'

  /skus:
    post:
      tags: [SKUs]
      summary: Create a SKU
      description: |
        `productId` must identify an existing product. `skuCode` is globally
        unique, and a product cannot repeat a size/color combination. A SKU is
        purchasable while its product is active and stock is available.
      operationId: createSku
      x-requirement: Manage product SKUs and variants
      x-contract-status: ready-to-implement
      x-authorization: manager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkuCreate'
            example:
              productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
              skuCode: CREW-BLUE-M
              size: M
              color: Blue
              price: '21.99'
              stockQuantity: 12
      responses:
        '201':
          description: SKU created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
                example: /v1/skus/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb3
              description: URL of the created SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sku'
              example:
                id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb3
                productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                skuCode: CREW-BLUE-M
                size: M
                color: Blue
                price: '21.99'
                currency: USD
                stockQuantity: 12
                createdAt: '2026-08-26T14:20:00Z'
                updatedAt: '2026-08-26T14:20:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Referenced product does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: '`skuCode` is already used, or the size/color combination already exists'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationError'

  /skus/{skuId}:
    parameters:
      - $ref: '#/components/parameters/SkuId'
    get:
      tags: [SKUs]
      summary: Get SKU details with resolved images
      description: |
        Returns SKU-specific images or product fallback images. Anonymous users
        and clients require an active product; managers can read any state.
      operationId: getSku
      x-requirement: Variant-specific image selection and top-level SKU model
      x-contract-status: ready-to-implement
      x-authorization: anonymous or authenticated manager/client
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: SKU detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkuDetail'
              example:
                id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
                productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                skuCode: CREW-RED-S
                size: S
                color: Red
                price: '19.99'
                currency: USD
                stockQuantity: 8
                createdAt: '2026-08-20T10:02:00Z'
                updatedAt: '2026-08-25T09:00:00Z'
                images:
                  - id: dddddddd-dddd-4ddd-8ddd-ddddddddddd2
                    productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                    url: https://cdn.example.com/products/classic-crew/red.jpg
                    skuIds:
                      - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
                      - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2
                    isProductPrimary: false
                    primaryForSkuIds:
                      - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
                      - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2
                    createdAt: '2026-08-20T10:06:00Z'
                primaryImageId: dddddddd-dddd-4ddd-8ddd-ddddddddddd2
                imageSource: sku
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SkuNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    patch:
      tags: [SKUs]
      summary: Update a SKU
      operationId: updateSku
      x-requirement: Manage product SKUs and variants
      x-contract-status: ready-to-implement
      x-authorization: manager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkuUpdate'
            example:
              stockQuantity: 10
      responses:
        '200':
          description: SKU representation immediately after the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sku'
              example:
                id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
                productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                skuCode: CREW-RED-S
                size: S
                color: Red
                price: '19.99'
                currency: USD
                stockQuantity: 10
                createdAt: '2026-08-20T10:02:00Z'
                updatedAt: '2026-08-26T14:25:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SkuNotFound'
        '409':
          description: '`skuCode` is already used, or the size/color combination already exists'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationError'

  /products/{productId}/images:
    post:
      tags: [Images]
      summary: Upload a product-owned image
      description: |
        Omit `skuIds` for a product fallback image, or supply product-owned SKU
        IDs for a shared variant image. Accepts JPEG, PNG, or WebP up to 5 MB.
        The response returns the stored public URL and created associations.
      operationId: uploadProductImage
      x-requirement: Manager uploads images per product; variant-specific images
      x-contract-status: ready-to-implement
      x-authorization: manager
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        description: |
          Send one `file` part, repeated `skuIds` parts when applicable, and an
          optional `primary` Boolean.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUpload'
            encoding:
              skuIds:
                style: form
                explode: true
      responses:
        '201':
          description: Image stored and associations created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAsset'
              example:
                id: dddddddd-dddd-4ddd-8ddd-ddddddddddd3
                productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                url: https://cdn.example.com/products/classic-crew/blue.jpg
                skuIds:
                  - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb3
                isProductPrimary: false
                primaryForSkuIds:
                  - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb3
                createdAt: '2026-08-26T14:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Product does not exist, or a supplied SKU does not belong to it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '413':
          description: File exceeds 5 MB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PayloadTooLargeProblem'
        '415':
          description: File is not JPEG, PNG, or WebP
          content:
            application/problem+json:
              schema:
