      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: ffffffff-ffff-4fff-8fff-fffffffffff7
                clientId: 11111111-1111-4111-8111-111111111111
                status: shipped
                paymentMethod: payment_intent
                items:
                  - id: ffffffff-ffff-4fff-8fff-fffffffffff8
                    productId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                    skuId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2
                    productName: Classic Crew T-Shirt
                    skuCode: CREW-RED-M
                    size: M
                    color: Red
