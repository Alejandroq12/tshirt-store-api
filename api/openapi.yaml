              schema:
                oneOf:
                  - $ref: '#/components/schemas/EmptyCartProblem'
                  - $ref: '#/components/schemas/PendingOrderExistsProblem'
              examples:
                emptyCart:
                  summary: The current cart has no items to snapshot
                  value:
                    type: urn:tshirt-store:problem:empty-cart
                    title: Cart is empty
                    status: 409
                pendingOrderExists:
                  summary: The client must finish or cancel the existing order
                  value:
                    type: urn:tshirt-store:problem:pending-order-exists
                    title: Pending order already exists
                    status: 409

